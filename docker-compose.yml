name: axia

# Published ports bind to 127.0.0.1 only. Nothing here has authentication of
# its own (Mongo has no users, the FastAPI service and the projector have no
# auth), and Docker-published ports bypass host firewalls such as ufw, so a
# 0.0.0.0 binding would put them on the internet if this file were ever used
# on a server without the production overlay.

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # ---------------------------------------------------------------------------
  # MongoDB — only started when MONGODB_MODE=local (profile=local)
  # ---------------------------------------------------------------------------
  mongo:
    profiles: ["local"]
    image: mongo:7
    container_name: axia-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-axia}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------------
  # mongo-init — seeds sample data on first boot
  # ---------------------------------------------------------------------------
  mongo-init:
    profiles: ["local"]
    image: mongo:7
    container_name: axia-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-axia}
      MONGODB_CORPUS_COLLECTION: ${MONGODB_CORPUS_COLLECTION:-sources}
      MONGODB_METADATA_COLLECTION: ${MONGODB_METADATA_COLLECTION:-metadata_records}
    volumes:
      - ./data/samples:/seed:ro
      - ./scripts/mongo-init:/init:ro
    entrypoint: ["bash", "/init/load_sample.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # projector — CPU-only XrayProcessor + PCA/UMAP server
  # ---------------------------------------------------------------------------
  projector:
    build:
      context: ./model/projector
      dockerfile: Dockerfile
    container_name: axia-projector
    restart: unless-stopped
    <<: *hardening
    ports:
      - "127.0.0.1:${PROJECTOR_PORT:-8001}:8001"
    environment:
      # The model repo is public, so no Hugging Face token is passed in. The
      # documented HF_TOKEN is a write token for publishing; giving it to a
      # container that processes user uploads would let a compromise of the
      # projector push code to the org's Hugging Face repos.
      HF_REPO_ID: ${HF_REPO_ID:-astromindinc/axia-qwen-xray-7b}
      PROJECTOR_CACHE_DIR: /cache
    volumes:
      - projector-cache:/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 120s

  # ---------------------------------------------------------------------------
  # service — FastAPI multi-agent orchestrator
  # ---------------------------------------------------------------------------
  service:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: axia-service
    restart: unless-stopped
    <<: *hardening
    ports:
      - "127.0.0.1:${SERVICE_PORT:-8000}:8000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-axia}
      MONGODB_CORPUS_COLLECTION: ${MONGODB_CORPUS_COLLECTION:-sources}
      MONGODB_METADATA_COLLECTION: ${MONGODB_METADATA_COLLECTION:-metadata_records}
      MODEL_SERVER_URL: ${MODEL_SERVER_URL:-}
      MODEL_SERVER_TOKEN: ${MODEL_SERVER_TOKEN:-}
      ALLOW_CUSTOM_MODEL_URL: ${ALLOW_CUSTOM_MODEL_URL:-false}
      PROJECTOR_URL: http://projector:8001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-5.6-sol}
      SERVICE_LOG_LEVEL: ${SERVICE_LOG_LEVEL:-info}
      SERVICE_DEBUG: ${SERVICE_DEBUG:-false}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
        required: false
      projector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # webapp — Next.js 15 playground
  # ---------------------------------------------------------------------------
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: axia-webapp
    restart: unless-stopped
    <<: *hardening
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-3000}:3000"
    environment:
      # Server-side (used by API routes running in Node)
      SERVICE_URL: http://service:8000
      MODEL_SERVER_URL: ${MODEL_SERVER_URL:-}
      ALLOW_CUSTOM_MODEL_URL: ${ALLOW_CUSTOM_MODEL_URL:-false}
      PROJECTOR_URL: http://projector:8001
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-axia}
      MONGODB_MODE: ${MONGODB_MODE:-local}
      MONGODB_CORPUS_COLLECTION: ${MONGODB_CORPUS_COLLECTION:-sources}
      MONGODB_METADATA_COLLECTION: ${MONGODB_METADATA_COLLECTION:-metadata_records}
      # Client-side (NEXT_PUBLIC_* are baked into the bundle at build-time;
      # we re-pass them here in case any client code reads them at runtime)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_DEBUG: ${NEXT_PUBLIC_DEBUG:-false}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    depends_on:
      service:
        condition: service_healthy

volumes:
  mongo-data:
    name: axia-mongo-data
  projector-cache:
    name: axia-projector-cache
