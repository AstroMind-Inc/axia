name: axia

# Production overlay — extends docker-compose.yml with:
#   - Caddy reverse proxy (auto-HTTPS)
#   - Log rotation on all containers
#   - Internal-only ports (only 80/443 exposed)
#   - Network segmentation (below)
#   - axia.autoheal labels, read by the host-side autoheal timer
#     (scripts/autoheal.sh, installed by scripts/prod-update.sh). No container
#     is given the Docker socket.
#
# Networks:
#   edge     caddy <-> webapp. Caddy can reach nothing else.
#   backend  webapp, service, projector; has internet egress (Google sign-in,
#            OpenAI, Hugging Face, HiPS2FITS).
#   data     mongo, reachable only by webapp, service and the seed job. No
#            egress. Mongo has no users, so this is what keeps a compromised
#            projector or proxy away from every user's chats and uploads.
#
# Usage:
#   make prod-up          (or)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile local up -d

services:
  # ---------------------------------------------------------------------------
  # Caddy — reverse proxy, automatic HTTPS via Let's Encrypt
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: axia-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      webapp:
        condition: service_started
      service:
        condition: service_healthy
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    labels:
      axia.autoheal: "true"
    # Probe Caddy's admin API, not the public site. Port 80 serves only an
    # automatic HTTP->HTTPS redirect, so a probe there follows a 308 to
    # https://localhost/ and fails the TLS handshake — the certificate is
    # issued for $DOMAIN, not "localhost". The check could therefore never
    # pass, and autoheal restarted the container on a loop.
    #
    # 127.0.0.1 is deliberate: the admin API listens on IPv4 only, while
    # "localhost" resolves to ::1 first inside this image and is refused.
    #
    # This checks Caddy itself rather than the upstream, which is what we
    # want — a webapp outage should not cause Caddy to be restarted.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Overrides — lock down ports, add log rotation
  # ---------------------------------------------------------------------------
  mongo:
    # Not published at all in production. Reach it with `make shell-mongo`
    # (docker exec), which needs no port.
    ports: !reset []
    networks: [data]
    labels:
      axia.autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mongo-init:
    networks: [data]

  projector:
    ports: !override
      - "127.0.0.1:8001:8001"
    networks: [backend]
    labels:
      axia.autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  service:
    ports: !override
      - "127.0.0.1:8000:8000"
    networks: [backend, data]
    labels:
      axia.autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  webapp:
    ports: !override
      - "127.0.0.1:3000:3000"
    networks: [edge, backend, data]
    labels:
      axia.autoheal: "true"
    environment:
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-https://${DOMAIN:-localhost}}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge: {}
  backend: {}
  data:
    internal: true

volumes:
  caddy-data:
    name: axia-caddy-data
  caddy-config:
    name: axia-caddy-config
